# Pool Station — Example Configuration (Lot 7)
# 
# This configuration demonstrates Lots 2-7 features:
#   - N-point calibration with multiple algorithms
#   - Capturer UI for calibration from Home Assistant
#   - Calibration persistence across reboots
#   - cal_invalid indicator when calibration is insufficient
#   - Lot 3: Filters (median window, jump guard, min/max clamp)
#   - Lot 3: Calibrated sensor (pre-guard diagnostic)
#   - Lot 4: Diagnostics (noise detection, stuck detection, out-of-range flags)
#   - Lot 5: Temperature compensation with Nernstian model for pH
#   - Lot 5: Calibration temperature metadata (Tw at save time)
#   - Lot 6: Gates and measurement campaigns (see README for full examples)
#   - Lot 7: Runtime algorithm selection
#   - Lot 7: Add/remove calibration points
#   - Lot 7: Draft/Commit workflow
#
# Hardware reference (Eric prod):
#   - DIYables ESP32-S3 UNO
#   - I2C: SDA=GPIO5, SCL=GPIO4
#   - ADS1115 @0x48: A0=pressure, A2=pH, A3=ORP
#   - Dallas DS18B20: water (GPIO17), air sensors (GPIO13)
#
# IMPORTANT: Temperature sensors MUST be bound by fixed address per SENSOR-IDENTITY.md
# Water temperature sensor: 0xc80200000000xxxx on GPIO17 (NEVER use index: 0)
#
# See docs/SENSOR-IDENTITY.md for address binding rules.

esphome:
  name: pool-station
  friendly_name: "Pool Station"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# External component from GitHub
external_components:
  - source: github://echavet/esphome-pool-station@main
    components: [pool_station]
    refresh: 1d

# WiFi configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Enable logging
logger:
  level: INFO
  logs:
    pool_station: DEBUG
    pool_station.cal: DEBUG
    pool_station.ui: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

# =============================================================================
# I2C Bus for ADS1115
# Hardware: DIYables ESP32-S3 UNO pinout
# =============================================================================
i2c:
  sda: GPIO5
  scl: GPIO4
  scan: true

# =============================================================================
# ADS1115 ADC (native ESPHome component)
# Address 0x48 (ADDR pin to GND)
# =============================================================================
ads1115:
  - address: 0x48
    id: ads
    continuous_mode: false

# =============================================================================
# Dallas 1-Wire buses
# =============================================================================
one_wire:
  - platform: gpio
    pin: GPIO17
    id: onewire_water
  - platform: gpio  
    pin: GPIO13
    id: onewire_air

# =============================================================================
# ADS1115 Source Sensors
# These are the RAW ADC readings that pool_station channels consume.
# Gain 4.096 gives ±4.096V range (resolution ~0.125mV)
# =============================================================================
sensor:
  # ---------------------------------------------------------------------------
  # Pressure sensor source — A0
  # Typical sensor: 0-5V output for 0-10 bar (via isolation module)
  # ---------------------------------------------------------------------------
  - platform: ads1115
    ads1115_id: ads
    multiplexer: 'A0_GND'
    gain: 4.096
    id: ads_pressure
    name: "ADS Pressure Source"
    internal: true
    update_interval: 1s

  # ---------------------------------------------------------------------------
  # pH sensor source — A2
  # Typical pH probe module: 0-3V output
  # ---------------------------------------------------------------------------
  - platform: ads1115
    ads1115_id: ads
    multiplexer: 'A2_GND'
    gain: 4.096
    id: ads_ph
    name: "ADS pH Source"
    internal: true
    update_interval: 1s

  # ---------------------------------------------------------------------------
  # ORP sensor source — A3
  # Typical ORP probe module: 0-3V output
  # ---------------------------------------------------------------------------
  - platform: ads1115
    ads1115_id: ads
    multiplexer: 'A3_GND'
    gain: 4.096
    id: ads_orp
    name: "ADS ORP Source"
    internal: true
    update_interval: 1s

  # ---------------------------------------------------------------------------
  # Temperature Sensors — ADDRESS-BOUND (see SENSOR-IDENTITY.md)
  # ---------------------------------------------------------------------------
  # Water temperature — immersed probe on GPIO17
  # CRITICAL: Must use FIXED ADDRESS per SENSOR-IDENTITY.md
  # The address below is the example from docs; replace with YOUR actual ROM address.
  # Run `esphome logs` to see discovered addresses, then bind by address, never index.
  #
  # Example format: 0xAABBCCDDEEFF1128 (last byte is usually 28 for DS18B20)
  # Actual address for Eric's water probe: 0xc802000000001c28
  - platform: dallas_temp
    one_wire_id: onewire_water
    address: 0xc802000000001c28  # ← YOUR immersed water probe address
    name: "Water Temperature"
    id: water_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 2
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

  # Air temperature — pump enclosure
  # IMPORTANT: Replace with YOUR actual DS18B20 ROM address (run `esphome logs` to discover)
  - platform: dallas_temp
    one_wire_id: onewire_air
    address: 0x7001000000000028  # ← PLACEHOLDER: replace with your actual pump air sensor address
    name: "Air Temperature (Pump)"
    id: air_pump_temp

  # Air temperature — local ambient
  # IMPORTANT: Replace with YOUR actual DS18B20 ROM address (run `esphome logs` to discover)
  - platform: dallas_temp
    one_wire_id: onewire_air
    address: 0x4401000000000028  # ← PLACEHOLDER: replace with your actual local air sensor address
    name: "Air Temperature (Local)"
    id: air_local_temp

# =============================================================================
# Pool Station Component (Lot 2)
# =============================================================================
pool_station:
  id: pool
  update_interval: 5s
  calibration_interval: 1s
  
  # Calibration Mode Switch
  # When ON: all channels sample at calibration_interval (1s)
  # When OFF: channels use their configured update_interval
  calibration_mode:
    name: "Pool Calibration Mode"
    id: cal_mode_switch

  # Channels - compose native ADS1115 sensors
  channels:
    # =========================================================================
    # PRESSURE Channel
    # Example: 0-5V output for 0-10 bar sensor
    # Using LINEAR calibration with 2 points
    # 
    # FILTERS: OFF (per Eric requirement - pressure needs fast, unfiltered response)
    # =========================================================================
    pressure:
      source_id: ads_pressure
      name: "Filter Pressure"
      unit_of_measurement: "bar"
      accuracy_decimals: 2
      icon: "mdi:gauge"
      update_interval: 2s
      
      # Raw voltage diagnostic sensor (always exposed)
      raw_sensor:
        name: "Filter Pressure Raw"
      
      # Calibration: linear 2-point
      # Example: 0.5V = 0 bar, 4.5V = 10 bar
      calibration:
        type: linear
        points:
          - x: 0.5    # Volts at 0 bar
            y: 0.0    # bar
          - x: 4.5    # Volts at 10 bar
            y: 10.0   # bar
      
      # Filters: explicitly OFF for pressure (this is the default)
      # Pressure sensors need fast response without smoothing
      # filters:
      #   filter_samples: 0     # No median (default)
      #   max_jump: 0.0         # No jump guard (default)
      
      # Diagnostics: Minimal for pressure (can enable without heavy filters)
      # Only out-of-range detection, no noise/stuck (fast response needed)
      diagnostics:
        range_min: 0.0
        range_max: 15.0
        out_of_range:
          name: "Pressure Out Of Range"
      
      # Capturer UI - allows editing calibration from HA
      # point_count = max preallocated HA slots (Add/Remove cannot create more).
      # point_count_number = live CalibrationEngine count.
      capturer:
        point_count: 5
        capture_buttons: true
        point_numbers: true
        save_button: true
        add_point_button:
          name: "Pressure Add Point"
        remove_point_button:
          name: "Pressure Remove Point"
        point_count_number:
          name: "Pressure Point Count"
      
      # Calibration invalid indicator
      cal_invalid:
        name: "Pressure Cal Invalid"

    # =========================================================================
    # pH Channel
    # Using PIECEWISE multi-point calibration (pH 4, 7, 10)
    # 
    # FILTERS: Mild median + value clamp (pH readings can be noisy)
    # Calibration mode bypasses filters for ~1s raw response
    # =========================================================================
    ph:
      source_id: ads_ph
      name: "Pool pH"
      unit_of_measurement: "pH"
      accuracy_decimals: 2
      icon: "mdi:ph"
      update_interval: 60s
      
      # Raw voltage diagnostic sensor (post-median filtered value)
      raw_sensor:
        name: "Pool pH Raw"
      
      # Calibrated sensor (pre-guard diagnostic value)
      # Shows calibrated value before jump guard filtering
      calibrated_sensor:
        name: "Pool pH Calibrated"
      
      # Calibration: piecewise 3-point (pH 4, 7, 10 buffers)
      # These are example values - replace with your actual calibration
      calibration:
        type: piecewise
        precision: 2
        points:
          - x: 2.03   # Volts at pH 4.01
            y: 4.01   # pH buffer 4
          - x: 1.50   # Volts at pH 7.00
            y: 7.00   # pH buffer 7
          - x: 0.98   # Volts at pH 10.00
            y: 10.00  # pH buffer 10
      
      # Filters (Lot 3): mild smoothing without breaking Capturer
      # Pipeline: raw → median → calibrate → clamp → jump guard → publish
      filters:
        filter_samples: 5        # 5-sample median window (smooths noise)
        max_jump: 0.5            # Reject pH jumps > 0.5
        max_jump_streak: 3       # Accept new plateau after 3 consistent readings
        value_min: 0.0           # Clamp to valid pH range
        value_max: 14.0
      
      # Diagnostics (Lot 4): Full noise/stuck/range monitoring
      # These sensors and flags are opt-in (only created if declared)
      diagnostics:
        noise_window: 10         # 10-sample sliding window for stats
        noise_warn_ptp: 0.3      # Warn if peak-to-peak > 0.3 pH
        noise_warn_sigma: 0.1    # Warn if stddev > 0.1 pH
        stuck_timeout: 300s      # Warn if no change for 5 minutes
        stuck_threshold: 0.01    # Minimum change to consider "not stuck"
        range_min: 0.0           # Out-of-range below 0 pH
        range_max: 14.0          # Out-of-range above 14 pH
        log_rate_limit: 60s      # Log warnings at most once per minute
        
        # Optional diagnostic sensors (Lovelace-friendly)
        mean_sensor:
          name: "Pool pH Mean"
        sigma_sensor:
          name: "Pool pH Noise (σ)"
        ptp_sensor:
          name: "Pool pH Peak-to-Peak"
        
        # Optional diagnostic flags (binary_sensors)
        noisy:
          name: "Pool pH Noisy"
        stuck:
          name: "Pool pH Stuck"
        out_of_range:
          name: "Pool pH Out Of Range"
      
      # =====================================================================
      # Temperature Compensation (Lot 5) — Nernstian pH correction
      # =====================================================================
      # pH electrodes have temperature-dependent slope (Nernst equation).
      # This compensates readings toward a reference temperature (default 25°C).
      # 
      # Formula: pH_comp = neutral_ph + (pH_meas - neutral_ph) × slope_ratio
      # where slope_ratio = (T_ref + 273.15) / (T_water + 273.15)
      #
      # At neutral_ph (7.0), temperature has NO effect (isopotential point).
      # Away from 7.0, warmer water gives slightly lower compensated pH.
      temperature_compensation:
        enabled: true                    # Enable compensation by default
        reference_temperature: 25.0      # Standard calibration temp (°C)
        neutral_ph: 7.0                  # Isopotential point
        
        # Runtime switch to enable/disable from Home Assistant
        enable_switch:
          name: "Pool pH Temp Compensation"
      
      # Diagnostic: shows water temperature at last calibration save
      calibration_temp_sensor:
        name: "Pool pH Calibration Tw"
      
      # Capturer UI — 5 HA slots so Add Point can show extra points.
      # Seed calibration still uses 3 points (pH 4/7/10); point_count_number
      # reports the live engine count.
      capturer:
        point_count: 5
        capture_buttons: true
        point_numbers: true
        save_button: true
        
        # =====================================================================
        # Lot 7: Advanced Capturer UI (optional)
        # =====================================================================
        # Runtime algorithm selection (change without reflash)
        algorithm_select:
          name: "Pool pH Algorithm"
        
        # Add/remove points dynamically
        add_point_button:
          name: "Pool pH Add Point"
        remove_point_button:
          name: "Pool pH Remove Point"
        point_count_number:
          name: "Pool pH Point Count"
        
        # Draft/Commit workflow (preview changes before applying)
        draft_mode: true
        commit_button:
          name: "Pool pH Commit Calibration"
        discard_button:
          name: "Pool pH Discard Changes"
        draft_pending:
          name: "Pool pH Draft Pending"
      
      cal_invalid:
        name: "pH Cal Invalid"

    # =========================================================================
    # ORP Channel
    # Using DFROBOT_ORP algorithm (SEN0165-like mid/offset)
    # Formula: ORP_mV = mid_mv - (V * 1000) - offset_mv
    # 
    # FILTERS: Jump guard to reject electrical spikes
    # =========================================================================
    orp:
      source_id: ads_orp
      name: "Pool ORP"
      unit_of_measurement: "mV"
      accuracy_decimals: 0
      icon: "mdi:flash"
      update_interval: 60s
      
      raw_sensor:
        name: "Pool ORP Raw"
      
      # Calibrated sensor (pre-guard)
      calibrated_sensor:
        name: "Pool ORP Calibrated"
      
      # Calibration: DFRobot SEN0165-like algorithm
      # mid_mv: midpoint reference (typically 2500 for 2.5V VRef)
      # offset_mv: calibration offset from known ORP solution
      calibration:
        type: dfrobot_orp
        mid_mv: 2500.0
        offset_mv: 0.0
      
      # Filters (Lot 3): jump guard for ORP spikes
      # ORP can have electrical spikes from pump interference
      filters:
        filter_samples: 3        # 3-sample median (light smoothing)
        max_jump: 50.0           # Reject ORP jumps > 50 mV
        max_jump_streak: 4       # Accept new level after 4 consistent readings
        value_min: -500.0        # Reasonable ORP range
        value_max: 1000.0
      
      # Diagnostics (Lot 4): ORP monitoring with appropriate thresholds
      diagnostics:
        noise_window: 10
        noise_warn_ptp: 30.0     # Warn if peak-to-peak > 30 mV
        noise_warn_sigma: 10.0   # Warn if stddev > 10 mV
        stuck_timeout: 600s      # ORP changes slower, 10 min timeout
        range_min: -200.0        # Very negative ORP is suspicious
        range_max: 900.0         # Above 900 mV is unusual for pools
        
        # Only flags for ORP (no stats sensors to reduce entity count)
        noisy:
          name: "Pool ORP Noisy"
        stuck:
          name: "Pool ORP Stuck"
        out_of_range:
          name: "Pool ORP Out Of Range"
      
      # =====================================================================
      # Temperature Compensation (Lot 5) — ORP correction (optional)
      # =====================================================================
      # ORP temperature compensation is less standardized than pH.
      # A simple linear model is available but DISABLED by default:
      #
      # Formula: ORP_comp = ORP_meas - orp_coefficient × (T_water - T_ref)
      #
      # Typical coefficients range 0.5-2.0 mV/°C depending on electrode.
      # Set orp_coefficient to 0 to disable (default).
      temperature_compensation:
        enabled: false                   # Disabled by default for ORP
        reference_temperature: 25.0
        orp_coefficient: 0.0             # mV/°C (0 = no compensation)
        
        # Uncomment to enable runtime control:
        # enable_switch:
        #   name: "Pool ORP Temp Compensation"
      
      # Diagnostic: shows water temperature at last calibration save
      calibration_temp_sensor:
        name: "Pool ORP Calibration Tw"
      
      # Capturer UI - includes mid/offset numbers for DFRobot
      capturer:
        point_count: 1     # Can capture offset from known solution
        capture_buttons: true
        point_numbers: false  # Less useful for dfrobot_orp
        save_button: true
        mid_number: true      # Enable mid_mv adjustment
        offset_number: true   # Enable offset_mv adjustment
      
      cal_invalid:
        name: "ORP Cal Invalid"

  # Water temperature for future Tw compensation (Lot 5)
  water_temperature:
    sensor_id: water_temp

# =============================================================================
# HOW TO CALIBRATE FROM HOME ASSISTANT
# =============================================================================
#
# 1. TURN ON CALIBRATION MODE
#    Toggle "Pool Calibration Mode" switch ON for fast 1s sampling.
#    NOTE: Calibration mode bypasses filters for immediate raw response!
#
# 2. CAPTURE CALIBRATION POINTS
#    For pH calibration example:
#    a) Immerse probe in pH 4 buffer solution
#    b) Wait for stable reading on "Pool pH Raw" sensor
#    c) Press "Ph Capture Point 1" button
#    d) Set "Ph Cal Point 1 Y" to 4.01 (actual buffer value)
#    e) Repeat with pH 7 buffer → capture point 2, set Y=7.00
#    f) Repeat with pH 10 buffer → capture point 3, set Y=10.00
#
# 3. SAVE CALIBRATION
#    Press "Ph Save Calibration" button to persist to flash.
#    Calibration survives reboots.
#
# 4. CHECK CALIBRATION STATUS
#    "Ph Cal Invalid" sensor shows ON if insufficient points for algorithm.
#
# 5. TURN OFF CALIBRATION MODE
#    Toggle "Pool Calibration Mode" switch OFF to return to normal sampling.
#    Filters will now be active again.
#
# =============================================================================
# SIGNAL PROCESSING PIPELINE (Lot 3)
# =============================================================================
#
#   raw → [median window] → raw_sensor → calibrate → calibrated_sensor
#       → [clamp] → [jump guard] → main entity
#
# - raw: Original ADC voltage from source sensor
# - median window: Optional N-sample median filter (filter_samples > 1)
# - raw_sensor: Diagnostic entity showing filtered raw voltage
# - calibrate: Apply calibration algorithm (linear, piecewise, etc.)
# - calibrated_sensor: Diagnostic entity showing calibrated value PRE-guard
# - clamp: Optional min/max value bounds (value_min, value_max)
# - jump guard: Optional absurd jump rejection (max_jump, max_jump_streak)
# - main entity: Final guarded value published to Home Assistant
#
# CALIBRATION MODE: Bypasses median window and jump guard for ~1s response
#
# =============================================================================
# FILTER CONFIGURATION (Lot 3)
# =============================================================================
#
# filters:
#   filter_samples: 0-20   # Median window size (0 or 1 = off)
#   max_jump: 0.0+         # Max allowed change (0 = off)
#   max_jump_streak: 1-10  # Accept new plateau after N consistent jumps
#   value_min: float       # Min clamp (omit = no min)
#   value_max: float       # Max clamp (omit = no max)
#
# PRESSURE: Keep filters OFF (fast response needed)
# pH: Mild median (5) + jump guard (0.5) + clamp (0-14)
# ORP: Light median (3) + jump guard (50mV) + clamp
#
# =============================================================================
# DIAGNOSTICS CONFIGURATION (Lot 4)
# =============================================================================
#
# diagnostics:
#   noise_window: 2-50      # Sliding window size for statistics
#   noise_warn_ptp: 0.0+    # Peak-to-peak threshold for noisy flag (0 = off)
#   noise_warn_sigma: 0.0+  # Stddev threshold for noisy flag (0 = off)
#   stuck_timeout: 0s+      # Time without change for stuck flag (0 = off)
#   stuck_threshold: 0.001  # Minimum change to consider "not stuck"
#   range_min: float        # Out-of-range minimum (omit = no check)
#   range_max: float        # Out-of-range maximum (omit = no check)
#   log_rate_limit: 60s     # Rate limit for diagnostic log messages
#
#   # Optional sensors (only created if declared):
#   mean_sensor:           # Mean of values in sliding window
#     name: "Channel Mean"
#   sigma_sensor:          # Standard deviation (noise indicator)
#     name: "Channel Noise"
#   ptp_sensor:            # Peak-to-peak (max - min)
#     name: "Channel PTP"
#
#   # Optional binary_sensor flags (only created if declared):
#   noisy:                 # True when ptp or sigma exceeds threshold
#     name: "Channel Noisy"
#   stuck:                 # True when no meaningful change for stuck_timeout
#     name: "Channel Stuck"
#   out_of_range:          # True when value outside range_min/max
#     name: "Channel Out Of Range"
#
# LOVELACE-FRIENDLY ENTITY NAMES (Lot 4):
#   - sensor.pool_ph_mean           → Mean pH over noise_window samples
#   - sensor.pool_ph_noise          → Stddev (σ) of pH readings
#   - sensor.pool_ph_peak_to_peak   → Max - Min over window
#   - binary_sensor.pool_ph_noisy   → ON when noise exceeds thresholds
#   - binary_sensor.pool_ph_stuck   → ON when no change for stuck_timeout
#   - binary_sensor.pool_ph_out_of_range → ON when outside valid range
#
# =============================================================================
# CALIBRATION ALGORITHMS AVAILABLE
# =============================================================================
#
# - linear: 2-point linear interpolation/extrapolation
#   Needs: 2 points minimum
#   Use for: pressure sensors, simple linear relationships
#
# - piecewise: Multi-point linear segments
#   Needs: 2+ points
#   Use for: pH sensors, non-linear but monotonic responses
#
# - polynomial: N-point polynomial regression
#   Needs: order+1 points (e.g., order=2 needs 3 points)
#   Use for: complex non-linear relationships
#   Configure: order (1-5), precision
#
# - dfrobot_orp: SEN0165-like mid/offset formula
#   Needs: 0 points (uses mid_mv and offset_mv params)
#   Formula: ORP_mV = mid_mv - (V * 1000) - offset_mv
#   Use for: DFRobot ORP modules or similar
#
# - exponential, logarithmic, power: NOT IMPLEMENTED (fall back to pass-through, do not use)
#
# =============================================================================
# TEMPERATURE COMPENSATION (Lot 5)
# =============================================================================
#
# ## pH Temperature Compensation (Nernstian Model)
#
# The Nernst equation's electrode slope is temperature-dependent:
#
#   slope(T) ≈ 59.16 × (T + 273.15) / 298.15  [mV/pH]
#
# The compensation formula normalizes readings to a reference temperature:
#
#   pH_compensated = neutral_ph + (pH_measured - neutral_ph) × slope_ratio
#
# where:
#   - slope_ratio = (T_ref + 273.15) / (T_measured + 273.15)
#   - T_ref = reference_temperature (default 25°C, standard calibration temp)
#   - T_measured = current water temperature from water_temperature sensor
#   - neutral_ph = isopotential point (default 7.0, where T has no effect)
#
# Example at 30°C water:
#   - pH measured: 7.50
#   - slope_ratio = 298.15 / 303.15 = 0.9835
#   - pH_compensated = 7.0 + (7.50 - 7.0) × 0.9835 = 7.492
#
# ## ORP Temperature Compensation (Linear Model, optional)
#
# ORP compensation is less standardized. A simple linear model is provided:
#
#   ORP_compensated = ORP_measured - orp_coefficient × (T_measured - T_ref)
#
# The orp_coefficient is in mV/°C. Typical range: 0.5-2.0 mV/°C.
# Default is 0 (disabled) because ORP compensation varies by electrode.
#
# ## Configuration
#
# temperature_compensation:
#   enabled: true/false           # Enable compensation (or use switch)
#   reference_temperature: 25.0   # Standard calibration temp (°C)
#   neutral_ph: 7.0               # Isopotential point (pH only)
#   orp_coefficient: 0.0          # Linear coefficient (ORP only, mV/°C)
#   enable_switch:                # Optional runtime switch entity
#     name: "pH Temp Compensation"
#
# ## Pipeline Order (Lot 5)
#
# raw → median → calibrate → TEMP_COMP → calibrated_sensor → clamp → jump → publish
#
# Temperature compensation is applied AFTER calibration but BEFORE guards.
# This ensures the compensation works on properly calibrated values.
#
# ## Calibration Temperature Metadata
#
# When saving calibration (pressing Save button), the current water temperature
# is stored with the calibration data. This allows:
#
# 1. Tracking what temperature the calibration was done at
# 2. Diagnostic display via calibration_temp_sensor entity
# 3. Future: auto-suggest recalibration if Tw differs significantly
#
# calibration_temp_sensor:
#   name: "pH Calibration Tw"    # Shows Tw at last calibration save
#
# =============================================================================
# LOT 7: ADVANCED CAPTURER UI
# =============================================================================
#
# ## Runtime Algorithm Selection
#
# Change calibration algorithm from Home Assistant without reflashing:
#
# capturer:
#   algorithm_select:
#     name: "pH Algorithm"       # Select entity: none/linear/piecewise/...
#
# Use cases:
# - Switch from linear to piecewise after adding more points
# - Test different algorithms for best fit
# - Revert to pass-through (none) for troubleshooting
#
# ## Add/Remove Calibration Points
#
# Dynamic point management from the UI:
#
# capturer:
#   point_count: 5               # Max HA slots (recommend 5–10). Not the live count.
#   add_point_button:            # Adds a point with x=0, y=0
#     name: "pH Add Point"
#   remove_point_button:         # Removes the last point
#     name: "pH Remove Point"
#   point_count_number:          # Live engine count (+ optional resize 1-10)
#     name: "pH Point Count"
#
# ## Draft/Commit Workflow
#
# Preview calibration changes before applying them:
#
# capturer:
#   draft_mode: true             # Enable draft mode (default: false)
#   commit_button:               # Apply draft → live (and save to flash)
#     name: "pH Commit"
#   discard_button:              # Revert draft to live
#     name: "pH Discard"
#   draft_pending:               # Binary sensor: ON when uncommitted changes
#     name: "pH Draft Pending"
#
# Workflow:
# 1. Enable draft_mode: true
# 2. Edit points using Capturer UI (changes go to draft)
# 3. Main sensor continues using live/committed calibration
# 4. Press Commit to apply draft to live (and save to flash)
# 5. Or press Discard to revert draft to live values
#
# BACKWARD COMPATIBILITY:
# - draft_mode: false (default) = legacy behavior (direct edits)
# - All Lot 7 components are opt-in (only created if declared)
#
# =============================================================================
